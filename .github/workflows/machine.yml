name: Machine contenu

on:
  schedule:
    - cron: "47 23 * * *"            # 3 h 47 a Dubai : generation des images du jour
    - cron: "7,22,37,52 * * * *"     # toutes les 15 min : decisions de Studio, videos, livraison, castings
  workflow_dispatch:
    inputs:
      commande:
        description: "Que lancer ?"
        type: choice
        options: [diagnostic, matin, suivi]
        default: diagnostic
      nombre:
        description: "Nombre de vidéos (pour un test, mettez 1)"
        default: ""

permissions:
  contents: read

concurrency:
  group: machine
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: machine-contenu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine-contenu/requirements.txt

      - name: Installer les outils
        run: |
          pip install -q -r requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Lancer
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          DRIVE_SCRIPT_URL: ${{ secrets.DRIVE_SCRIPT_URL }}
          DRIVE_SCRIPT_SECRET: ${{ secrets.DRIVE_SCRIPT_SECRET }}
          NB_VIDEOS: ${{ inputs.nombre }}
          STUDIO_URL: ${{ vars.STUDIO_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then CMD="${{ inputs.commande }}";
          elif [ "${{ github.event.schedule }}" = "47 23 * * *" ]; then CMD=matin;
          else CMD=suivi; fi
          echo "Commande : $CMD"
          python -m machine "$CMD"
